pekko {
  loglevel = "WARNING"

  actor {
    # All conversation actors (Router, Auth, Chat, Book, Monitorings, etc.) perform
    # blocking, synchronous calls (LuxMed HTTP API, JDBC) directly inside their receive
    # loop. The default dispatcher is a ForkJoinPool tuned for non-blocking CPU-bound
    # work with only a handful of threads and no automatic compensation for blocked
    # threads. If enough conversations block at once (e.g. a slow/unresponsive remote
    # LuxMed API, or contention on the per-account session lock), the whole pool can be
    # starved, and since the Router actor shares the very same pool, incoming Telegram
    # commands stop being routed/processed even though updates are still being received.
    #
    # Use a thread-pool-executor with a generous, fixed number of threads instead, which
    # is the right tool for blocking workloads and gives much more headroom before
    # starvation can occur.
    default-dispatcher {
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 64
      }
      throughput = 1
    }
  }
}

